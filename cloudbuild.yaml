steps:
  # Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/face-scan-api:$COMMIT_SHA'
      - '-f'
      - './Dockerfile'
      - '.'

  # Push the image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/face-scan-api:$COMMIT_SHA'

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'face-scan-api'
      - '--image'
      - 'gcr.io/$PROJECT_ID/face-scan-api:$COMMIT_SHA'
      - '--region'
      - 'asia-southeast3'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '4Gi'
      - '--cpu'
      - '2'
      - '--port'
      - '8000'
      - '--min-instances'
      - '1'
      - '--max-instances'
      - '10'
      - '--set-env-vars'
      - >-
        SUPABASE_URL=https://htgmakeuytiknkumxgii.supabase.co,
        SUPABASE_SERVICE_ROLE_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh0Z21ha2V1eXRpa25rdW14Z2lpIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4NjIxMTEwNCwiZXhwIjoyMTAxNzg3MTA0fQ.GmN3JhCSTRDkruAkxKyV5lSYus7uxdBsN8UzchBaYsI,
        SUPABASE_ANON_KEY=sb_publishable_G_JyjQD6qiNvOb73Qzmy1Q_fw5JGuhC,
        STORAGE_BUCKET=photos,
        R2_WORKER_URL=https://cs.face-scan-r2.workers.dev,
        R2_THUMB_API_KEY=N3wrLp65xEHeEc1dywCsV1MTkLnFvmA92GnV1ku2JCU=,
        FACE_PACK=buffalo_l,
        CORS_ORIGINS_CSV=*,
        INDEX_API_KEY=,
        OMP_NUM_THREADS=2

options:
  logging: CLOUD_LOGGING_ONLY

images:
  - 'gcr.io/$PROJECT_ID/face-scan-api:$COMMIT_SHA'

timeout: '1800s'
